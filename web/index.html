<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Домашки</title>
<style>
  :root {
    --bg: #f4f3ef; --surface: #ffffff; --raised: #ffffff; --text: #1b1a18; --muted: #75716a;
    --faint: #ebe9e3; --border: #e2dfd7; --accent: #3b5bdb; --accent-text: #ffffff;
    --danger: #d9480f; --danger-bg: #fff0e6; --warn: #e67700; --warn-bg: #fff6db;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121211; --surface: #1c1b19; --raised: #242320; --text: #efeee9; --muted: #9e9a91;
      --faint: #2a2926; --border: #34322e; --accent: #7d94ff; --accent-text: #0d0d0c;
      --danger: #ff8a5c; --danger-bg: #3a2219; --warn: #ffc34d; --warn-bg: #352b14;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 16px 120px; }

  .date { color: var(--muted); font-size: 14px; font-weight: 500; }
  h1 { font-size: 36px; font-weight: 800; letter-spacing: -.03em; margin: 2px 0 18px; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 12px 14px; }
  .stat b { display: block; font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .stat span { font-size: 12px; color: var(--muted); }

  .segment { display: flex; background: var(--faint); border-radius: 12px; padding: 3px; }
  .segment button { flex: 1; border: 0; background: transparent; padding: 8px; border-radius: 9px; color: var(--muted); font-weight: 500; font-size: 14px; }
  .segment button.on { background: var(--raised); color: var(--text); font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,.08); }

  .subj-row { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 2px; scrollbar-width: none; }
  .subj-row::-webkit-scrollbar { display: none; }
  .subj-chip { flex: none; display: flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface);
    padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 500; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }

  .section-head { display: flex; align-items: baseline; gap: 8px; margin: 26px 4px 10px; }
  .section-head h3 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .section-head span { color: var(--muted); font-weight: 600; font-size: 14px; }
  .section-head.overdue h3 { color: var(--danger); }

  .card { position: relative; display: flex; gap: 12px; width: 100%; text-align: left; overflow: hidden;
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 14px 14px 14px 18px;
    margin-bottom: 10px; box-shadow: var(--shadow); transition: transform .08s, opacity .15s; }
  .card:hover { transform: translateY(-1px); }
  .card:active { transform: scale(.99); opacity: .8; }
  .stripe { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
  .icon { flex: none; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-weight: 700; font-size: 16px; }
  .card-body { flex: 1; min-width: 0; }
  .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
  .card-subj { flex: 1; min-width: 0; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { flex: none; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 700; }
  .card-title { font-size: 16px; font-weight: 600; margin: 0; overflow-wrap: anywhere; }
  .card-desc { color: var(--muted); font-size: 14px; margin: 3px 0 0; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .center { text-align: center; padding: 60px 16px; color: var(--muted); }
  .center .big { font-size: 44px; margin-bottom: 8px; }
  .center b { display: block; color: var(--text); font-size: 18px; margin-bottom: 4px; }
  .center.error b { color: var(--danger); }
  .btn { border: 1px solid var(--border); background: var(--surface); border-radius: 14px; padding: 12px 18px; font-weight: 600; }

  .fab { position: fixed; right: max(20px, calc(50% - 360px)); bottom: 32px; width: 62px; height: 62px; border-radius: 22px; border: 0;
    background: var(--accent); color: var(--accent-text); font-size: 34px; font-weight: 300; line-height: 1;
    box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 45%, transparent); transition: transform .1s; }
  .fab:hover { transform: translateY(-2px); }
  .fab:active { transform: scale(.94); }

  dialog { border: 0; padding: 0; border-radius: 20px; width: min(560px, calc(100% - 24px)); max-height: calc(100% - 40px);
    background: var(--bg); color: var(--text); box-shadow: 0 24px 70px rgba(0,0,0,.3); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .sheet-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .sheet-head h2 { margin: 0; font-size: 17px; }
  .link { border: 0; background: none; color: var(--accent); font-size: 16px; padding: 0; }
  .link.strong { font-weight: 700; }
  .link:disabled { opacity: .4; }
  .sheet-body { padding: 20px; }
  .field { margin-bottom: 24px; }
  .label { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; display: block; }
  input, textarea { width: 100%; border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px;
    background: var(--surface); color: var(--text); font: inherit; font-size: 16px; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  #title { font-size: 18px; font-weight: 600; }
  textarea { min-height: 110px; resize: vertical; }
  .err { color: var(--danger); font-size: 13px; margin-top: 6px; }
  .err:empty { display: none; }
  .form-err { color: var(--danger); margin-bottom: 14px; }

  .subj-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .subj-opt { display: flex; align-items: center; gap: 10px; padding: 10px; min-height: 58px; text-align: left;
    border: 1.5px solid var(--border); border-radius: 14px; background: var(--surface); color: var(--muted); font-size: 13px; line-height: 1.3; }
  .subj-opt .ic { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  .subj-opt.on { color: var(--text); font-weight: 600; }

  .days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .day { flex: none; width: 58px; padding: 9px 0; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); text-align: center; }
  .day small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
  .day b { display: block; font-size: 20px; font-weight: 800; line-height: 1.25; }
  .day i { display: block; font-style: normal; font-size: 11px; color: var(--muted); }
  .day.sun small { color: var(--danger); }
  .day.on { background: var(--accent); border-color: var(--accent); }
  .day.on small, .day.on b, .day.on i { color: var(--accent-text); }
  .alt { margin-top: 10px; font-size: 14px; }

  .delete { width: 100%; border: 0; background: var(--danger-bg); color: var(--danger); border-radius: 14px; padding: 14px; font-weight: 600; }

  .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 12px; font-size: 14px; transition: all .2s; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 520px) {
    .subj-grid { grid-template-columns: 1fr; }
    h1 { font-size: 30px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="date" id="today"></div>
  <h1>Домашки</h1>
  <div class="stats" id="stats" hidden></div>
  <div class="segment" id="segment"></div>
  <div class="subj-row" id="subjRow" hidden></div>
  <main id="list"></main>
</div>

<button class="fab" id="addBtn" aria-label="Добавить домашку">+</button>

<dialog id="dlg">
  <form id="form" novalidate>
    <div class="sheet-head">
      <button type="button" class="link" id="cancelBtn">Отмена</button>
      <h2 id="dlgTitle">Новая домашка</h2>
      <button type="submit" class="link strong" id="saveBtn">Готово</button>
    </div>
    <div class="sheet-body">
      <div class="form-err" id="formErr" hidden></div>
      <div class="field">
        <label class="label" for="title">Что задали</label>
        <input id="title" placeholder="Например, № 143–144" autocomplete="off">
        <div class="err" data-for="title"></div>
      </div>
      <div class="field">
        <span class="label">Предмет</span>
        <div class="subj-grid" id="subjGrid"></div>
        <div class="err" data-for="subject_id"></div>
      </div>
      <div class="field">
        <span class="label">Сдать до</span>
        <div class="days" id="days"></div>
        <input id="customDate" type="date" hidden>
        <div class="alt"><button type="button" class="link" id="altBtn" style="font-size:14px">Другая дата…</button></div>
        <div class="err" data-for="due_date"></div>
      </div>
      <div class="field">
        <label class="label" for="description">Подробности</label>
        <textarea id="description" placeholder="Страницы, условия, ссылки — необязательно"></textarea>
      </div>
      <button type="button" class="delete" id="deleteBtn" hidden>Удалить домашку</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script>
// Должно совпадать с migrations/002_seed_subjects.sql и mobile/subjects.js
const SUBJECTS = [
  { id: 1,  name: "Математический анализ",                       short: "Матан",    icon: "∫",   color: "#4263eb" },
  { id: 2,  name: "Алгебра и геометрия",                         short: "Алгебра",  icon: "△",   color: "#7048e8" },
  { id: 3,  name: "Информационные технологии и программирование", short: "ИТиП",     icon: "</>", color: "#0c8599" },
  { id: 4,  name: "Физика",                                      short: "Физика",   icon: "⚛",   color: "#e8590c" },
  { id: 5,  name: "Введение в специальность",                    short: "Введение", icon: "✦",   color: "#2f9e44" },
  { id: 6,  name: "Иностранный язык",                            short: "Англ.",    icon: "En",  color: "#d6336c" },
  { id: 7,  name: "История России",                              short: "История",  icon: "Ⅸ",   color: "#a6611a" },
  { id: 8,  name: "Основы Российской государственности",         short: "ОРГ",      icon: "§",   color: "#c92a2a" },
  { id: 9,  name: "Введение в языкознание",                      short: "Языкозн.", icon: "Aa",  color: "#5c7cfa" },
  { id: 10, name: "Физическая культура и спорт",                 short: "Физра",    icon: "◎",   color: "#37b24d" },
];
const subjectById = (id) => SUBJECTS.find((s) => s.id === id) || { id, name: `Предмет ${id}`, short: `#${id}`, icon: "?", color: "#868e96" };

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const toKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dateOnly = (s) => s.slice(0, 10);
const addDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return toKey(d); };
const parseKey = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const daysUntil = (k) => { const t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((parseKey(k) - t) / 86400000); };
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const fmtLong = (k) => parseKey(k).toLocaleDateString("ru-RU", { weekday: "long", day: "numeric", month: "long" });
const fmtShort = (k) => parseKey(k).toLocaleDateString("ru-RU", { day: "numeric", month: "short" });
const WEEKDAYS = ["вс", "пн", "вт", "ср", "чт", "пт", "сб"];
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return a; if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return b; return c; };
const days = (n) => `${n} ${plural(n, "день", "дня", "дней")}`;

let items = [], filter = "upcoming", subjectFilter = null, loaded = false;
let editing = null, formSubject = null, formDue = null, customDate = false;

function sectionTitle(k) {
  const d = daysUntil(k);
  if (d < 0) return "Просрочено";
  if (d === 0) return "Сегодня";
  if (d === 1) return "Завтра";
  if (d < 7) return cap(parseKey(k).toLocaleDateString("ru-RU", { weekday: "long" }));
  return cap(fmtLong(k));
}
function duePill(k) {
  const d = daysUntil(k);
  if (d < 0) return `<span class="pill" style="background:var(--danger-bg);color:var(--danger)">−${days(-d)}</span>`;
  if (d <= 1) return `<span class="pill" style="background:var(--warn-bg);color:var(--warn)">${d ? "завтра" : "сегодня"}</span>`;
  return `<span class="pill" style="background:var(--faint);color:var(--muted)">${fmtShort(k)}</span>`;
}

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200);
}

async function api(method, path, body) {
  const res = await fetch(path, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  if (res.status === 204) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(data.error || `Ошибка ${res.status}`); e.data = data; throw e; }
  return data;
}

async function load() {
  try {
    items = await api("GET", "/homeworks");
    loaded = true;
    render();
  } catch (e) {
    $("#stats").hidden = true;
    $("#list").innerHTML = `<div class="center error"><div class="big">⚠︎</div><b>${esc(e.message === "Failed to fetch" ? "Нет связи с сервером" : e.message)}</b>
      Проверь, что бэкенд запущен<br><br><button class="btn" onclick="load()">Повторить</button></div>`;
  }
}

function render() {
  const today = toKey(new Date()), tomorrow = addDays(1);
  const due = (h) => dateOnly(h.due_date);
  const st = {
    today: items.filter((h) => due(h) === today).length,
    tomorrow: items.filter((h) => due(h) === tomorrow).length,
    overdue: items.filter((h) => due(h) < today).length,
    upcoming: items.filter((h) => due(h) >= today).length,
  };
  $("#stats").hidden = false;
  $("#stats").innerHTML = `
    <div class="stat"><b style="color:${st.today ? "var(--warn)" : "var(--muted)"}">${st.today}</b><span>на сегодня</span></div>
    <div class="stat"><b>${st.tomorrow}</b><span>на завтра</span></div>
    <div class="stat"><b style="color:${st.overdue ? "var(--danger)" : "var(--muted)"}">${st.overdue}</b><span>просрочено</span></div>`;

  $("#segment").innerHTML = [["upcoming", `Впереди${st.upcoming ? " · " + st.upcoming : ""}`], ["all", "Все"], ["past", "Прошедшие"]]
    .map(([k, l]) => `<button data-f="${k}" class="${filter === k ? "on" : ""}">${l}</button>`).join("");

  const used = SUBJECTS.filter((s) => items.some((h) => h.subject_id === s.id));
  if (subjectFilter && !used.some((s) => s.id === subjectFilter)) subjectFilter = null;
  $("#subjRow").hidden = used.length < 2;
  $("#subjRow").innerHTML = `<button class="subj-chip" data-s="" style="${!subjectFilter ? "background:var(--text);color:var(--bg);border-color:var(--text)" : ""}">Все предметы</button>` +
    used.map((s) => {
      const on = subjectFilter === s.id;
      return `<button class="subj-chip" data-s="${s.id}" style="${on ? `background:${s.color};border-color:${s.color};color:#fff` : ""}">
        <span class="dot" style="background:${on ? "#fff" : s.color}"></span>${esc(s.short)}</button>`;
    }).join("");

  let list = items;
  if (subjectFilter) list = list.filter((h) => h.subject_id === subjectFilter);
  if (filter === "upcoming") list = list.filter((h) => due(h) >= today);
  if (filter === "past") list = list.filter((h) => due(h) < today).slice().reverse();

  if (!list.length) {
    $("#list").innerHTML = `<div class="center"><div class="big">${filter === "past" ? "🗂" : "🎉"}</div>
      <b>${filter === "past" ? "Прошедших заданий нет" : "Всё сделано"}</b>Нажми «+», чтобы добавить домашку</div>`;
    return;
  }

  const groups = new Map();
  for (const h of list) {
    const k = due(h);
    const key = filter !== "past" && k < today ? "overdue" : k;
    if (!groups.has(key)) groups.set(key, { date: k, overdue: key === "overdue" || k < today, data: [] });
    groups.get(key).data.push(h);
  }

  $("#list").innerHTML = [...groups].map(([key, g]) => `
    <section>
      <div class="section-head ${g.overdue ? "overdue" : ""}"><h3>${key === "overdue" ? "Просрочено" : sectionTitle(g.date)}</h3><span>${g.data.length}</span></div>
      ${g.data.map((h) => {
        const s = subjectById(h.subject_id);
        return `<button class="card" data-id="${h.id}">
          <span class="stripe" style="background:${s.color}"></span>
          <span class="icon" style="background:${s.color}1f;color:${s.color}">${esc(s.icon)}</span>
          <span class="card-body">
            <span class="card-top"><span class="card-subj" style="color:${s.color}">${esc(s.name)}</span>${duePill(due(h))}</span>
            <p class="card-title">${esc(h.title)}</p>
            ${h.description ? `<p class="card-desc">${esc(h.description)}</p>` : ""}
          </span>
        </button>`;
      }).join("")}
    </section>`).join("");
}

// ---------- форма ----------
function renderSubjGrid() {
  $("#subjGrid").innerHTML = SUBJECTS.map((s) => {
    const on = formSubject === s.id;
    return `<button type="button" class="subj-opt ${on ? "on" : ""}" data-s="${s.id}" style="${on ? `border-color:${s.color};background:${s.color}18` : ""}">
      <span class="ic" style="background:${on ? s.color : s.color + "1f"};color:${on ? "#fff" : s.color}">${esc(s.icon)}</span>${esc(s.name)}</button>`;
  }).join("");
}
function renderDays() {
  $("#days").hidden = customDate;
  $("#customDate").hidden = !customDate;
  $("#altBtn").textContent = customDate ? "Выбрать из ближайших дней" : "Другая дата…";
  if (customDate) { $("#customDate").value = formDue || ""; return; }
  $("#days").innerHTML = Array.from({ length: 21 }, (_, i) => {
    const k = addDays(i), d = parseKey(k);
    const wd = i === 0 ? "сег" : i === 1 ? "завт" : WEEKDAYS[d.getDay()];
    return `<button type="button" class="day ${formDue === k ? "on" : ""} ${d.getDay() === 0 ? "sun" : ""}" data-d="${k}">
      <small>${wd}</small><b>${d.getDate()}</b><i>${d.toLocaleDateString("ru-RU", { month: "short" }).replace(".", "")}</i></button>`;
  }).join("");
  const on = $("#days .on");
  if (on) on.scrollIntoView({ block: "nearest", inline: "center" });
}
function clearErrors() {
  document.querySelectorAll(".err").forEach((e) => (e.textContent = ""));
  $("#formErr").hidden = true;
}
function openForm(hw) {
  editing = hw;
  clearErrors();
  $("#dlgTitle").textContent = hw ? "Изменить" : "Новая домашка";
  $("#title").value = hw ? hw.title : "";
  $("#description").value = hw ? hw.description : "";
  formSubject = hw ? hw.subject_id : (items.length ? items[items.length - 1].subject_id : null);
  formDue = hw ? dateOnly(hw.due_date) : addDays(1);
  const d = daysUntil(formDue);
  customDate = d < 0 || d > 20;
  $("#deleteBtn").hidden = !hw;
  renderSubjGrid();
  $("#dlg").showModal();
  renderDays();
  if (!hw) $("#title").focus();
}

$("#subjGrid").addEventListener("click", (e) => {
  const b = e.target.closest("[data-s]"); if (!b) return;
  formSubject = Number(b.dataset.s); renderSubjGrid();
});
$("#days").addEventListener("click", (e) => {
  const b = e.target.closest("[data-d]"); if (!b) return;
  formDue = b.dataset.d; renderDays();
});
$("#customDate").addEventListener("input", (e) => (formDue = e.target.value));
$("#altBtn").addEventListener("click", () => { customDate = !customDate; renderDays(); });
$("#cancelBtn").addEventListener("click", () => $("#dlg").close());
$("#addBtn").addEventListener("click", () => openForm(null));

$("#form").addEventListener("submit", async (e) => {
  e.preventDefault();
  clearErrors();
  const local = {};
  if (!$("#title").value.trim()) local.title = "Напиши, что задали";
  if (!formSubject) local.subject_id = "Выбери предмет";
  if (!formDue) local.due_date = "Выбери дату";
  if (Object.keys(local).length) return showErrors(local);

  const body = { title: $("#title").value, subject_id: formSubject, due_date: formDue, description: $("#description").value };
  const btn = $("#saveBtn"); btn.disabled = true;
  try {
    if (editing) await api("PUT", `/homeworks/${editing.id}`, body);
    else await api("POST", "/homeworks", body);
    $("#dlg").close();
    toast(editing ? "Сохранено" : "Домашка добавлена");
    load();
  } catch (err) {
    if (err.data && err.data.fields) showErrors(err.data.fields);
    else { $("#formErr").textContent = err.message; $("#formErr").hidden = false; }
  } finally { btn.disabled = false; }
});
function showErrors(fields) {
  for (const [k, v] of Object.entries(fields)) {
    const el = document.querySelector(`.err[data-for="${k}"]`);
    if (el) el.textContent = v;
  }
}

$("#deleteBtn").addEventListener("click", async () => {
  if (!editing || !confirm(`Удалить «${editing.title}»?`)) return;
  try { await api("DELETE", `/homeworks/${editing.id}`); $("#dlg").close(); toast("Удалено"); load(); }
  catch (err) { $("#formErr").textContent = err.message; $("#formErr").hidden = false; }
});

$("#list").addEventListener("click", (e) => {
  const c = e.target.closest(".card"); if (!c) return;
  openForm(items.find((h) => h.id === Number(c.dataset.id)));
});
$("#segment").addEventListener("click", (e) => {
  const b = e.target.closest("[data-f]"); if (!b) return;
  filter = b.dataset.f; render();
});
$("#subjRow").addEventListener("click", (e) => {
  const b = e.target.closest("[data-s]"); if (!b) return;
  const id = Number(b.dataset.s) || null;
  subjectFilter = subjectFilter === id ? null : id; render();
});

$("#today").textContent = cap(fmtLong(toKey(new Date())));
$("#segment").innerHTML = `<button class="on">Впереди</button><button>Все</button><button>Прошедшие</button>`;
$("#list").innerHTML = `<div class="center">Загрузка…</div>`;
load();
</script>
</body>
</html>
